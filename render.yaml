databases:
  - name: zayqora-db
    databaseName: zayqora
    user: zayqora
    plan: free
    region: oregon

services:
  - type: web
    name: zayqora-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:api
    startCommand: node apps/api/dist/scripts/migrate.js && node apps/api/dist/src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zayqora-db
          property: connectionString
      - key: PGSSL
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "lax"
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        value: "ZAYQORA <noreply@yourdomain.com>"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MEDIA_STORAGE
        value: local
      - key: MEDIA_LOCAL_ROOT
        value: /tmp/zayqora-media
