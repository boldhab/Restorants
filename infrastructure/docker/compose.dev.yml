services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '1234'
      POSTGRES_DB: zayqora_dev
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - zayqora_pg:/var/lib/postgresql/data
      - ./init-test.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d zayqora_dev']
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025','127.0.0.1:8025:8025']
volumes:
  zayqora_pg:
