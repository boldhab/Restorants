services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env.staging
    restart: unless-stopped
    expose: ['4000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_PROXY_URL: http://api:4000
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api:
        condition: service_healthy
