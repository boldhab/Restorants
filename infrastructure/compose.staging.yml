services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env.staging
    environment:
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_LOCAL_ROOT: /var/lib/zayqora-media
    volumes: ['restaurant-media:/var/lib/zayqora-media']
    restart: unless-stopped
    expose: ['4000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 3
  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env.staging
    command: ['node', 'apps/api/dist/scripts/worker.js']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "if(Date.now()-require('fs').statSync('/tmp/zayqora-worker-heartbeat').mtimeMs>60000)process.exit(1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_PROXY_URL: http://api:4000
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://configure-staging-origin.invalid}
      API_PROXY_URL: http://api:4000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api:
        condition: service_healthy

volumes:
  restaurant-media:
